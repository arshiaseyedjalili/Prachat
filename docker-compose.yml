name: prachat

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../services/jarvis-core/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [jarvis]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [jarvis]

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_data:/root/.ollama]
    ports: ["${OLLAMA_PORT:-11434}:11434"]
    restart: unless-stopped
    networks: [jarvis]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: ${WEBUI_AUTH:-True}
    volumes: [webui_data:/app/backend/data]
    ports: ["${WEBUI_PORT:-3000}:8080"]
    depends_on:
      ollama: {condition: service_started}
      postgres: {condition: service_healthy}
    restart: unless-stopped
    networks: [jarvis]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-jarvis}
    ports: ["${LITELLM_PORT:-4000}:4000"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
    networks: [jarvis]

  jarvis-core:
    build: ../services/jarvis-core
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/jarvis.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKSPACE_ROOT: /workspaces
      ARTIFACT_ROOT: /artifacts
      STATE_FILE: /data/state.json
      OPENHANDS_BASE_URL: ${OPENHANDS_BASE_URL:-http://openhands:3000}
      CONTEXT_TOKEN_BUDGET: ${CONTEXT_TOKEN_BUDGET:-4096}
    volumes:
      - core_data:/data
      - ../workspaces:/workspaces
      - ../artifacts:/artifacts
    ports: ["${CORE_PORT:-8000}:8000"]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [jarvis]

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  webui_data:
  core_data:

networks:
  jarvis:
    driver: bridge
    internal: false
